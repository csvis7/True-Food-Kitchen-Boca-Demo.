kind = "web"
previewPath = "/"
title = "True Food Kitchen Boca Raton"
description = "A polished restaurant website demo for True Food Kitchen Boca Raton, featuring seasonal dining, menu highlights, reservations, ordering, and location details."
version = "1.0.0"
id = "artifacts/true-food-kitchen-boca"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20429

[services.development]
run = "pnpm --filter @workspace/true-food-kitchen-boca run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/true-food-kitchen-boca", "run", "build" ]
serve = "static"
publicDir = "artifacts/true-food-kitchen-boca/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20429"
BASE_PATH = "/"
